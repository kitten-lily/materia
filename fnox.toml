# fnox secret config — non-secret, committed to git.
# Docs: https://fnox.jdx.dev/providers/proton-pass.html
#
# Prereqs:
#   1. pass-cli login  (scoped PAT, read-only on the "materia" vault)
#   2. Create a "hetzner" item using the "API Credential" template
#      (Hetzner Cloud API token, Read+Write)
#   3. Create a "materia" item using the "SSH Key" template
#      (public key for the core user on Flatcar, baked into Ignition)
#   4. Create an item for the age private key — store the full key.txt contents
#      (AGE-SECRET-KEY-...) in a field named "key"
#   5. Create a "healthchecks" item with a field named "ping-url" containing
#      the slug-mode base ping URL (https://hc-ping.com/<ping-key> — project
#      ping key, NO trailing slash, no slug). Per-server slugs are derived
#      from the server name at transpile time (materia-update-<server>).

# Never inject these into a shell. Every caller reads a secret explicitly with
# `fnox get NAME`, which ignores this setting. The only consumer of the default
# `env = true` is the `fnox activate fish` prompt hook, which resolved all five
# secrets as concurrent pass-cli calls on every prompt inside the checkout:
# that corrupts a logged-out pass-cli state (concurrent first-time init writes
# a db the stored local key can't open: "hmac check failed"), and it exported
# the age private key and Hetzner token into every interactive shell. It also
# drops them from `fnox exec`, which is why no task uses it any more.
# Same fix as krytis (starlit-os/krytis#987, docs/skills/mise.md there).
env = false

[providers.protonpass]
type = "proton-pass"
vault = "materia"

[secrets]
HCLOUD_TOKEN = { provider = "protonpass", value = "hetzner/API Key" }
CORE_SSH_PUBKEY = { provider = "protonpass", value = "materia/Public key" }
AGE_SECRET_KEY = { provider = "protonpass", value = "materia-age/key" }
SOPS_AGE_KEY = { provider = "protonpass", value = "materia-age/key" }
HC_PING_URL = { provider = "protonpass", value = "healthchecks/ping-url" }
