# .github/workflows/badger-catalog.yml
name: badger-catalog

# Only changes that can move the pinned badger version run this gate, so a
# catalog hiccup can't turn unrelated commits red (BUG-013).
on:
  push:
    branches: [main]
    paths:
      - components/pangolin/MANIFEST.toml
      - .github/workflows/badger-catalog.yml
  pull_request:
    branches: [main]
    paths:
      - components/pangolin/MANIFEST.toml
      - .github/workflows/badger-catalog.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  badger-plugin-catalog:
    name: badger version accepted by traefik plugin catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Traefik disables ALL plugins when one fails its catalog integrity
      # check, which invalidates every router referencing the badger
      # middleware and makes the edge node answer 404 for every hostname —
      # dashboard included (BUG-007; Renovate PR #52 bumped badger v1.5.0 ->
      # v1.6.1 and did exactly that). Gate the pinned version on the same
      # check so a bump can't reach a host before we know the catalog
      # accepts it.
      #
      # This mirrors traefik's own check (pkg/plugins/downloader.go +
      # manager.go's computeHash): download the archive, then
      # `GET plugins.traefik.io/public/validate/<module>/<version>` with
      # `X-Plugin-Hash: <hex sha256 of the archive>`. Anything other than 200
      # fails the load. The header is required: without it, or with a wrong
      # hash, the catalog answers 404 for every plugin and version (BUG-014).
      - name: badger catalog validate check
        run: |
          set -euo pipefail
          manifest="components/pangolin/MANIFEST.toml"
          version="$(sed -n 's/^badgerVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest")"
          if [[ -z "$version" ]]; then
            echo "::error::no badgerVersion found in $manifest"
            exit 1
          fi
          echo "pinned badger version: $version"

          base="https://plugins.traefik.io/public"
          module="github.com/fosrl/badger"
          archive="$(mktemp)"
          if ! dl="$(curl -sS -o "$archive" --max-time 60 --retry 3 --retry-all-errors \
              -w '%{http_code}' "$base/download/$module/$version")"; then
            echo "::warning::could not reach the traefik plugin catalog — skipping"
            exit 0
          fi
          if [[ "$dl" != "200" ]]; then
            echo "::error::traefik plugin catalog has no archive for badger $version (HTTP $dl)"
            exit 1
          fi
          hash="$(sha256sum "$archive" | cut -d' ' -f1)"
          echo "archive sha256: $hash"

          # Retry for ~2 min with backoff to ride out origin blips (BUG-011),
          # logging the Cloudflare edge (cf-ray suffix), cache status and age
          # of every answer (BUG-013). A real rejection (BUG-007) is a steady
          # non-200 and still fails, just later.
          code=""
          for delay in 5 10 20 40 60 0; do
            if out="$(curl -sS -o /dev/null --max-time 30 -H "X-Plugin-Hash: $hash" \
                -w '%{http_code} %header{cf-ray} %header{cf-cache-status} %header{age}' \
                "$base/validate/$module/$version")"; then
              read -r code ray cache age <<<"$out"
              echo "catalog answered HTTP $code (cf-ray=${ray:-?} cache=${cache:-?} age=${age:-?})"
              [[ "$code" == "200" ]] && break
            else
              code=""
            fi
            sleep "$delay"
          done

          if [[ -z "$code" ]]; then
            echo "::warning::could not reach the traefik plugin catalog — skipping"
            exit 0
          fi

          if [[ "$code" == "200" ]]; then
            echo "OK — traefik plugin catalog accepts badger $version"
            exit 0
          fi

          echo "::error::traefik plugin catalog rejects badger $version (HTTP $code)"
          echo "traefik would disable ALL plugins on startup, dropping every"
          echo "badger-referencing router and returning 404 for every host."
          echo "see specs/bugs/BUG-007, BUG-014, fosrl/badger#31, traefik/piceus#156."
          exit 1
