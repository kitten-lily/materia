# .github/workflows/badger-catalog.yml
name: badger-catalog

# Only changes that can move the pinned badger version run this gate. The
# catalog answer depends on which Cloudflare edge serves the request
# (BUG-013), so running it on every push turned unrelated commits red.
on:
  push:
    branches: [main]
    paths:
      - components/pangolin/MANIFEST.toml
      - .github/workflows/badger-catalog.yml
  pull_request:
    branches: [main]
    paths:
      - components/pangolin/MANIFEST.toml
      - .github/workflows/badger-catalog.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  badger-plugin-catalog:
    name: badger version accepted by traefik plugin catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Traefik disables ALL plugins when one fails its catalog integrity
      # check, which invalidates every router referencing the badger
      # middleware and makes the edge node answer 404 for every hostname —
      # dashboard included (BUG-007; Renovate PR #52 bumped badger v1.5.0 ->
      # v1.6.1 and did exactly that). Traefik's check is
      # `GET plugins.traefik.io/public/validate/<module>/<version>`; anything
      # other than 200 fails the load. Gate the pinned version on it here so a
      # bump can't reach a host before we know the catalog accepts it.
      - name: badger catalog validate check
        run: |
          set -euo pipefail
          manifest="components/pangolin/MANIFEST.toml"
          version="$(sed -n 's/^badgerVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest")"
          if [[ -z "$version" ]]; then
            echo "::error::no badgerVersion found in $manifest"
            exit 1
          fi
          echo "pinned badger version: $version"

          url="https://plugins.traefik.io/public/validate/github.com/fosrl/badger/$version"
          # The catalog sits behind Cloudflare, and each edge caches its own
          # answer (BUG-011, BUG-013). A 404 can persist at one edge for minutes
          # while another serves 200. Retry for ~2 min with backoff and log the
          # edge (cf-ray suffix), cache status and age of every answer. A real
          # rejection (BUG-007) is a steady 404 and still fails, just later.
          code=""
          for delay in 5 10 20 40 60 0; do
            if out="$(curl -sS -o /dev/null --max-time 30 \
                -w '%{http_code} %header{cf-ray} %header{cf-cache-status} %header{age}' "$url")"; then
              read -r code ray cache age <<<"$out"
              echo "catalog answered HTTP $code (cf-ray=${ray:-?} cache=${cache:-?} age=${age:-?})"
              [[ "$code" == "200" ]] && break
            else
              code=""
            fi
            sleep "$delay"
          done

          if [[ -z "$code" ]]; then
            echo "::warning::could not reach the traefik plugin catalog — skipping"
            exit 0
          fi

          if [[ "$code" == "200" ]]; then
            echo "OK — traefik plugin catalog accepts badger $version"
            exit 0
          fi

          echo "::error::traefik plugin catalog rejects badger $version (HTTP $code)"
          echo "traefik would disable ALL plugins on startup, dropping every"
          echo "badger-referencing router and returning 404 for every host."
          echo "see specs/bugs/BUG-007, fosrl/badger#31, traefik/piceus#156."
          echo "a 404 from one Cloudflare edge alone is not proof (BUG-013):"
          echo "re-run, and curl the URL from elsewhere before acting on it."
          exit 1
