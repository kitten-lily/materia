Secrets = ["serverSecret", "cfDnsApiToken"]

[Defaults]
appName = "My Network"
# A badger version traefik can't load disables ALL plugins and drops every
# badger-referencing router => 404 on every host (BUG-007). v1.6.0-v1.7.0 were
# broken in the plugin catalog until 2026-08-27 (traefik/traefik#13771) and
# held at v1.5.0. Lifted 2026-11-05 after v1.8.0 passed the catalog check
# (with traefik's X-Plugin-Hash, BUG-014) and a local traefik load test.
# Needed for Pangolin >= 1.22 public resources. Bumps are manual PRs
# (renovate.json5): test them the same way before merging.
badgerVersion = "v1.8.0"

[[Services]]
Service = "pangolin-pod.service"

[[Services]]
Service = "app.service"
RestartedBy = ["app.container", "config/config.yml", "config/privateConfig.yml"]

[[Services]]
Service = "gerbil.service"
RestartedBy = ["gerbil.container"]

[[Services]]
Service = "traefik.service"
RestartedBy = ["traefik.container", "traefik/traefik_config.yml", "traefik/dynamic_config.yml"]
