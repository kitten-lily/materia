# db-dump: nightly logical dumps of bow's databases into the db-dumps volume,
# which restic carries off-host (#194). No Secrets: each dump unit references
# the podman secret its app component already owns (grimmory, mediamanager,
# silentsuite, pinepods). Add a dump only after that component's first
# materia run has created the secret.

[Settings]
# Same reason as restic-backup (BUG-004): materia's default restart of a
# changed .container expects the unit to end up active, which a oneshot
# dump isn't. Changes take effect at the next 23:30 run.
NoRestart = true

[Defaults]
dbDumpOnCalendar = "*-*-* 23:30:00"

[[Services]]
Service = "db-dump-grimmory.service"
Stopped = true
Oneshot = true

[[Services]]
Service = "db-dump-mediamanager.service"
Stopped = true
Oneshot = true

[[Services]]
Service = "db-dump-silentsuite.service"
Stopped = true
Oneshot = true

[[Services]]
Service = "db-dump-pinepods.service"
Stopped = true
Oneshot = true

[[Services]]
Service = "db-dump-trigger.service"
Stopped = true

[[Services]]
Service = "db-dump.timer"
Static = true
