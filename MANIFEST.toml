[Hosts.flutterina]
Components = ["pangolin", "beszel-hub"]
Roles = ["base", "tunneled", "tailnet"]

# Flatcar's btrfs OEM partitions are noise in beszel's storage pools.
[Hosts.flutterina.Extensions.beszel-agent.Defaults]
beszelHideBtrfsPools = true

# Peer relay (#163 phase 1b): tag:relay is the dst of the policy's
# tailscale.com/cap/relay grant. Applied at first login only (TS_AUTH_ONCE).
[Hosts.flutterina.Extensions.tailscale.Defaults]
tailscaleTags = "tag:server,tag:relay"

[Roles.base]
Components = ["restic-backup", "beszel-agent"]

[Roles.tunneled]
Components = ["newt"]

# Host-level Tailscale node, kernel mode (#163).
[Roles.tailnet]
Components = ["tailscale"]

[Hosts.bow]
Components = ["music", "grimmory", "audiobookshelf", "jellyfin", "buildbarn", "mediamanager", "tailscale-gateway"]
Roles = ["base", "tunneled"]

[Hosts.krytis-runner]
Components = ["beszel-agent"]
Roles = ["tailnet"]

# Host-side MagicDNS so krytis CI resolves svc:bst-cache's
# bst-cache.<tailnet>.ts.net (#163 phase 4). Debian, systemd-resolved stub.
[Hosts.krytis-runner.Extensions.tailscale.Defaults]
tailscaleMagicDns = true

# bow's LVM data volume — reported as an extra disk by beszel-agent.
[Hosts.bow.Extensions.beszel-agent.Defaults]
beszelExtraFilesystem = "/var/lib/materia-data"
# Explicit root device: without it the agent picks the most active device
# (the data LV) as root, which swallows the Data disk entry.
beszelRootFilesystem = "sda"
beszelHideBtrfsPools = true
