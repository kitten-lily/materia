# Bluefin pilot (#179) Phase 2: keep Tailscale off the pod network.
# Installed as /etc/systemd/system/tailscaled.service.d/50-pilot.conf.
#
# Tailscale advertises every local interface address as a direct endpoint and
# skips only ZeroTier (zt*) and NetBird (wt0) interfaces (net/netmon/state.go,
# isProblematicInterface, v1.104.7), so it also advertises Cilium's
# cilium_host address. A peer then reaches it "directly" through Cilium's
# VXLAN, which itself runs over Tailscale: a tunnel inside a tunnel (seen as
# `direct 10.244.0.x:41641`, 739 ms pings). Bluefin ships no nft/iptables, so
# policy routing makes the pod and service ranges unreachable for traffic
# carrying Tailscale's socket mark (0x80000/0xff0000) only.
#
# The second line keeps tailnet-bound traffic off the underlay while Tailscale
# is down. Tailscale's own routes live in table 52, consulted (pref 5270)
# before main, so this changes nothing while it is up; without it, traffic to
# a 100.64.0.0/10 peer falls back to the default route and can reach the
# cluster through another tailnet member on the underlay (seen in Phase 2's
# first resilience run). More specific routes inside the range still win.
[Service]
ExecStartPre=/bin/sh -c 'for c in 10.244.0.0/16 10.96.0.0/12; do ip rule del pref 90 fwmark 0x80000/0xff0000 to $$c 2>/dev/null; ip rule add pref 90 fwmark 0x80000/0xff0000 to $$c prohibit; done'
ExecStartPre=/usr/bin/ip route replace unreachable 100.64.0.0/10
