# Bluefin pilot (#179) Phase 3: attempt the data mount before kubelet starts.
# Installed as /etc/systemd/system/kubelet.service.d/60-pilot-data.conf.
# Wants=, not Requires=: kubelet runs the control plane's static pods, so a
# missing data disk must not take the API down with it (design D6).
[Unit]
Wants=var-lib-pilot\x2ddata.mount
After=var-lib-pilot\x2ddata.mount
