# Bluefin pilot (#179) Phase 3: config for the pilot-lvm2 sysext's static lvm.
# Installed as /usr/share/pilot-lvm2/lvm.conf; the lvm wrapper points
# LVM_SYSTEM_DIR here. Design: specs/plans/bluefin-server-pilot-phase3.md (D6).
#
# Bluefin's /usr has no LVM udev rules (upstream #487 pruned them; the initrd
# keeps its own copy and does the boot-time activation), so this lvm must not
# wait for udev and creates its own /dev/<vg>/<lv> nodes.
activation {
	udev_sync = 0
	udev_rules = 0
	# Never let this binary activate on events: activation at boot belongs to
	# the initrd, or to the explicit pilot-lvm-activate.service fallback.
	auto_activation_volume_list = []
}
devices {
	obtain_device_list_from_udev = 0
	use_devicesfile = 0
}
global {
	event_activation = 0
}
backup {
	# /usr is read-only: metadata backups go to /var.
	backup_dir = "/var/lib/pilot-lvm2/backup"
	archive_dir = "/var/lib/pilot-lvm2/archive"
}
