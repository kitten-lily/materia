# Bluefin pilot (#179) Phase 3 step 5: attempt the backup-disk mount before
# kubelet starts on the worker. Installed as
# /etc/systemd/system/kubelet.service.d/60-pilot-backup.conf. Wants=, not
# Requires= (same reasoning as the control plane's data LV).
[Unit]
Wants=var-lib-pilot\x2dbackup.mount
After=var-lib-pilot\x2dbackup.mount
