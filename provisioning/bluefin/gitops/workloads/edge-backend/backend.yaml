apiVersion: v1
kind: Namespace
metadata:
  name: pilot-edge-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-backend
  namespace: pilot-edge-backend
spec:
  replicas: 1
  selector:
    matchLabels: {app: edge-backend}
  template:
    metadata:
      labels: {app: edge-backend}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: bluefin-pilot-node
      containers:
      - name: netexec
        image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
        args: [netexec, --http-port=8080]
        ports:
        - {name: http, containerPort: 8080}
        readinessProbe:
          httpGet: {path: "/echo?msg=ready", port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: edge-backend
  namespace: pilot-edge-backend
spec:
  type: ClusterIP
  selector: {app: edge-backend}
  ports:
  - {name: http, port: 8080, targetPort: http}
