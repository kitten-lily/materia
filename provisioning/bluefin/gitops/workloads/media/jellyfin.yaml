# Jellyfin, the Kubernetes form of components/jellyfin/jellyfin.container.gotmpl:
# same image pin, read-only Movies and TVShows (separate read-only volumes over
# the same directories MediaManager writes), /config on a static volume,
# /cache ephemeral. No /dev/dri in a VM: hardware transcoding stays a bow
# hardware gate (plan).
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
spec:
  selector: {app: jellyfin}
  ports: [{port: 8096, targetPort: 8096}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: jellyfin}
  template:
    metadata:
      labels: {app: jellyfin}
    spec:
      containers:
      - name: jellyfin
        image: docker.io/jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
        env:
        - {name: TZ, value: Etc/UTC}
        ports: [{containerPort: 8096}]
        readinessProbe:
          httpGet: {path: /health, port: 8096}
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
        - {name: movies, mountPath: /media/Movies, readOnly: true}
        - {name: tvshows, mountPath: /media/TVShows, readOnly: true}
        - {name: config, mountPath: /config}
        - {name: cache, mountPath: /cache}
        resources:
          requests: {cpu: 100m, memory: 768Mi}
          limits: {memory: 768Mi}
      volumes:
      - name: movies
        persistentVolumeClaim: {claimName: movies-ro, readOnly: true}
      - name: tvshows
        persistentVolumeClaim: {claimName: tvshows-ro, readOnly: true}
      - name: config
        persistentVolumeClaim: {claimName: jellyfin-config}
      - name: cache
        emptyDir: {sizeLimit: 2Gi}
