apiVersion: v1
kind: Namespace
metadata:
  name: pilot-edge-envoy
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: pilot-edge
  namespace: pilot-edge-envoy
spec:
  provider:
    type: Kubernetes
    kubernetes:
      useListenerPortAsContainerPort: true
      envoyService:
        type: ClusterIP
      envoyDeployment:
        replicas: 1
        container:
          # Keep the distroless UID and grant only the extra low-port capability.
          securityContext:
            runAsUser: 65532
            capabilities:
              add: [NET_BIND_SERVICE]
        patch:
          type: StrategicMerge
          value:
            spec:
              # The old pod must release host ports before a replacement starts.
              strategy:
                type: Recreate
                rollingUpdate: null
              template:
                spec:
                  hostNetwork: true
                  dnsPolicy: ClusterFirstWithHostNet
                  nodeSelector: {pilot.bluefin/edge: "true"}
                  tolerations:
                  - {key: pilot.bluefin/edge, operator: Equal, value: "true", effect: NoSchedule}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: pilot-edge
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: pilot-edge
    namespace: pilot-edge-envoy
