# Bluefin pilot (#179) Phase 4 step 3, Envoy arm: one tailnet-only route
# through the Tailscale operator (edge-ingress investigation, "Proposed
# shape" 2). A second EnvoyProxy, not on the edge: no hostNetwork, so the
# proxy schedules on the home worker (the edge and the control plane are
# tainted), and its Service is a LoadBalancer of class `tailscale`, which the
# operator exposes as tailnet device bluefin-pilot-gw. Tailnet grants decide
# who reaches it; nothing here is public. Plain HTTP: the tailnet encrypts.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: pilot-tailnet
  namespace: pilot-edge-envoy
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        loadBalancerClass: tailscale
        allocateLoadBalancerNodePorts: false
        annotations:
          tailscale.com/hostname: bluefin-pilot-gw
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: pilot-tailnet
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: pilot-tailnet
    namespace: pilot-edge-envoy
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pilot-tailnet
  namespace: pilot-edge-envoy
spec:
  gatewayClassName: pilot-tailnet
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-tailnet
  namespace: pilot-edge-envoy
spec:
  parentRefs:
  - {name: pilot-tailnet, sectionName: http}
  rules:
  - backendRefs:
    - {name: edge-backend, namespace: pilot-edge-backend, port: 8080}
