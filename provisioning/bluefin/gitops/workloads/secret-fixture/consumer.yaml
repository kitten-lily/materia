# Logs "revision=<n> sha256=<first 16 hex of the value>" at start. Reloader
# (homelab component) rolls it when the Secret changes, so a rotation shows up
# as a new pod with a new prefix. The value itself is never printed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-consumer
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels: {app: secret-consumer}
  template:
    metadata:
      labels: {app: secret-consumer}
    spec:
      containers:
      - name: consumer
        image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "$(date -u +%FT%TZ) revision=$(cat /secret/revision) sha256=$(sha256sum /secret/value | cut -c1-16)"
          while true; do sleep 3600; done
        volumeMounts:
        - {name: secret, mountPath: /secret, readOnly: true}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 32Mi}
      volumes:
      - name: secret
        secret: {secretName: pilot-secret}
