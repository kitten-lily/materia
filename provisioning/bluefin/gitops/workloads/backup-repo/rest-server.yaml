# Bluefin pilot (#179) Phase 3 step 5: the test backup repository (design D5),
# a restic REST server on the worker, its data on the worker's backup disk
# (PV pilot-restic). In-cluster only (ClusterIP), no auth: the repository is
# encrypted by its restic password, and this is a pilot test target, not the
# production Storage Box. Image pinned by digest.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restic
spec:
  storageClassName: pilot-static
  volumeName: pilot-restic
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 7Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: rest-server
spec:
  selector: {app: rest-server}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: rest-server}
  template:
    metadata:
      labels: {app: rest-server}
    spec:
      containers:
      - name: rest-server
        image: docker.io/restic/rest-server:0.14.0@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
        command: [rest-server, --path, /data, --listen, ":8000", --no-auth]
        ports: [{containerPort: 8000}]
        readinessProbe:
          tcpSocket: {port: 8000}
          periodSeconds: 10
        volumeMounts:
        - {name: data, mountPath: /data}
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 128Mi}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: restic}
