apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pilot-edge-backend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/kitten-lily/materia.git
    targetRevision: main
    path: provisioning/bluefin/gitops/workloads/edge-backend
  destination:
    server: https://kubernetes.default.svc
    namespace: pilot-edge-backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
