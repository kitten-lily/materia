# Bluefin pilot (#179) Phase 3 step 2: the KSOPS secret fixture. Needs the
# bootstrap's KSOPS patch on argocd-repo-server (mise bluefin:pilot:bootstrap).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pilot-secret-fixture
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kitten-lily/materia.git
    targetRevision: main
    path: provisioning/bluefin/gitops/workloads/secret-fixture
  destination:
    server: https://kubernetes.default.svc
    namespace: pilot-secret
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
