# Bluefin pilot (#179) Phase 1 step 3: cross-node dataplane fixture.
# One agnhost netexec pod pinned to each node, each behind its own ClusterIP
# Service, so a pod on one node can probe the other node's pod by pod IP and
# by Service name (via netexec's /dial endpoint). Image pinned by digest.
apiVersion: v1
kind: Namespace
metadata:
  name: pilot-dataplane
---
apiVersion: v1
kind: Pod
metadata:
  name: srv-cp
  namespace: pilot-dataplane
  labels: {app: srv-cp}
spec:
  nodeName: bluefin-pilot-cp
  containers:
  - name: netexec
    image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
    args: ["netexec", "--http-port=8080"]
    ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata:
  name: srv-node
  namespace: pilot-dataplane
  labels: {app: srv-node}
spec:
  nodeName: bluefin-pilot-node
  containers:
  - name: netexec
    image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
    args: ["netexec", "--http-port=8080"]
    ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: svc-cp
  namespace: pilot-dataplane
spec:
  selector: {app: srv-cp}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: svc-node
  namespace: pilot-dataplane
spec:
  selector: {app: srv-node}
  ports: [{port: 80, targetPort: 8080}]
