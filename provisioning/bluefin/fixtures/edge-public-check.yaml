# Bluefin pilot (#179) Phase 4, E3 check: known listeners on the edge host,
# so `mise bluefin:pilot:edge-fw-check` can tell an allowed port from a
# denied one by Cilium's verdict, not by silence. hostNetwork agnhost netexec
# answers HTTP and UDP ("echo …") on:
#   tcp 443, udp 443    pilot-edge-public
#   udp 51820, 21820    pilot-edge-gerbil
#   tcp 80              pilot-edge-acme-http
#   tcp 8080            no policy: must always be denied (negative control)
# Remove it before an arm's own listeners need the same ports.
apiVersion: v1
kind: Namespace
metadata:
  name: pilot-edge-check
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Pod
metadata:
  name: listeners
  namespace: pilot-edge-check
spec:
  hostNetwork: true
  nodeSelector: {pilot.bluefin/edge: "true"}
  tolerations:
  - {key: pilot.bluefin/edge, operator: Equal, value: "true", effect: NoSchedule}
  containers:
  - name: https-quic
    image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
    args: ["netexec", "--http-port=443", "--udp-port=443"]
  - name: gerbil
    image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
    args: ["netexec", "--http-port=8080", "--udp-port=51820"]
  - name: gerbil-relay
    image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
    args: ["netexec", "--http-port=80", "--udp-port=21820"]
